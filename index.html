<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings Goal Calculator – How Much Should I Save Each Month? | Tabutility</title>
  <meta name="description" content="Free savings goal calculator. Find out exactly how much to save each month to reach your target by a set date. View year-by-year progress and compare different interest rates." />
  <meta name="keywords" content="savings goal calculator, how much to save per month, savings target calculator, monthly savings calculator, reach savings goal" />
  <link rel="canonical" href="https://savings-goal-calculator.tabutility.com/" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#f0fdf4;}.site-nav{background:#1a1a2e;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}.site-nav a{color:#a5b4fc;text-decoration:none;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;}.nav-brand{color:#fff;font-weight:700;font-size:16px;font-family:'Segoe UI',Arial,sans-serif;}#ad-top,#ad-bottom{text-align:center;padding:10px;background:#fff;}</style>
</head>
<body>
  <nav class="site-nav"><span class="nav-brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
  <div id="ad-top"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="horizontal" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
  <div id="root"></div>
  <div id="ad-bottom"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="rectangle" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
  <script type="text/babel">
    //<![CDATA[
    const { useState } = React;

    const fmt = (n,sym) => sym + Math.round(n).toLocaleString();
    const fmtDec = (n,sym) => sym + n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});

    function SavingsGoalCalculator() {
      const [currency, setCurrency] = useState("gbp");
      const [goalAmount, setGoalAmount] = useState("20000");
      const [currentSavings, setCurrentSavings] = useState("2000");
      const [annualReturn, setAnnualReturn] = useState("4.5");
      const [years, setYears] = useState("5");
      const [result, setResult] = useState(null);

      const sym = currency === "gbp" ? "£" : "$";

      const calculate = () => {
        const goal = parseFloat(goalAmount)||0;
        const current = parseFloat(currentSavings)||0;
        const r = parseFloat(annualReturn)||0;
        const y = parseFloat(years)||0;
        const monthlyRate = r / 100 / 12;
        const n = y * 12;
        const fvFactor = Math.pow(1 + monthlyRate, n);
        const fvCurrent = current * fvFactor;
        let requiredMonthly;
        if (monthlyRate === 0) requiredMonthly = (goal - fvCurrent) / n;
        else requiredMonthly = (goal - fvCurrent) * monthlyRate / (fvFactor - 1);
        requiredMonthly = Math.max(0, requiredMonthly);
        const totalContributions = current + requiredMonthly * n;
        const totalInterest = goal - totalContributions;
        const scenarios = [1,2,3,4,5,6,7,8].map(rr => {
          const mr = rr / 100 / 12;
          const ff = Math.pow(1 + mr, n);
          const fvc = current * ff;
          const pmt = mr > 0 ? Math.max(0, (goal-fvc)*mr/(ff-1)) : Math.max(0,(goal-fvc)/n);
          return { rate: rr, monthly: pmt };
        });
        const yearly = [];
        for (let yr = 1; yr <= Math.min(y, 30); yr++) {
          const perds = yr * 12;
          const fvL = current * Math.pow(1 + monthlyRate, perds);
          const fvC = monthlyRate > 0 ? requiredMonthly * (Math.pow(1 + monthlyRate, perds) - 1) / monthlyRate : requiredMonthly * perds;
          yearly.push({ year: yr, balance: fvL + fvC, target: goal });
        }
        setResult({ goal, current, requiredMonthly, totalContributions, totalInterest, r, y, yearly, scenarios });
      };

      const inputStyle = { width:"100%",padding:"12px",border:"2px solid #bbf7d0",borderRadius:10,fontSize:16,boxSizing:"border-box",outline:"none" };
      const labelStyle = { display:"block",fontWeight:600,marginBottom:6,color:"#333" };

      return (
        <div style={{ fontFamily:"'Segoe UI',Arial,sans-serif",background:"#f0fdf4",minHeight:"100vh",padding:"20px" }}>
          <div style={{ maxWidth:820,margin:"0 auto" }}>
            <div style={{ textAlign:"center",marginBottom:32 }}>
              <div style={{ fontSize:48,marginBottom:8 }}>🎯</div>
              <h1 style={{ margin:0,fontSize:32,fontWeight:800,color:"#1a1a2e" }}>Savings Goal Calculator</h1>
              <p style={{ margin:"8px 0 0",color:"#555",fontSize:16 }}>Find out exactly how much to save each month to hit your target</p>
            </div>
            <div style={{ background:"#fff",borderRadius:16,padding:28,boxShadow:"0 4px 24px rgba(0,0,0,0.08)",marginBottom:24 }}>
              <div style={{ display:"flex",gap:8,marginBottom:20 }}>
                {[["gbp","£ GBP"],["usd","$ USD"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setCurrency(v)} style={{ padding:"8px 20px",borderRadius:8,border:`2px solid ${currency===v?"#059669":"#bbf7d0"}`,background:currency===v?"#059669":"#fff",color:currency===v?"#fff":"#333",fontWeight:600,cursor:"pointer" }}>{l}</button>
                ))}
              </div>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))",gap:20 }}>
                {[
                  { label:`Savings Goal (${sym})`, value:goalAmount, set:setGoalAmount, prefix:sym },
                  { label:`Current Savings (${sym})`, value:currentSavings, set:setCurrentSavings, prefix:sym },
                  { label:"Expected Annual Return (%)", value:annualReturn, set:setAnnualReturn, suffix:"%" },
                  { label:"Time to Goal (Years)", value:years, set:setYears, suffix:"yrs" },
                ].map(({ label,value,set,prefix,suffix }) => (
                  <div key={label}>
                    <label style={labelStyle}>{label}</label>
                    <div style={{ position:"relative" }}>
                      {prefix && <span style={{ position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#666",fontWeight:600 }}>{prefix}</span>}
                      <input type="number" value={value} onChange={e=>set(e.target.value)} style={{...inputStyle,paddingLeft:prefix?28:12,paddingRight:suffix?40:12}} />
                      {suffix && <span style={{ position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"#666" }}>{suffix}</span>}
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={calculate} style={{ width:"100%",marginTop:24,padding:"16px",background:"linear-gradient(135deg, #059669, #0d9488)",color:"#fff",border:"none",borderRadius:12,fontSize:18,fontWeight:700,cursor:"pointer" }}>Calculate Monthly Savings</button>
            </div>
            {result && <>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(170px,1fr))",gap:16,marginBottom:24 }}>
                {[
                  { label:"Required Monthly Saving", value:fmtDec(result.requiredMonthly,sym), color:"#059669", bg:"#f0fdf4" },
                  { label:"Savings Goal", value:fmt(result.goal,sym), color:"#0d9488", bg:"#f0fdfa" },
                  { label:"Total Contributions", value:fmt(result.totalContributions,sym), color:"#0369a1", bg:"#e0f2fe" },
                  { label:"Interest Earned", value:fmt(Math.max(0,result.totalInterest),sym), color:"#7c3aed", bg:"#faf5ff" },
                ].map((item,i)=>(
                  <div key={i} style={{ background:item.bg,borderRadius:14,padding:18,textAlign:"center",border:`2px solid ${item.color}22` }}>
                    <div style={{ fontSize:22,fontWeight:800,color:item.color }}>{item.value}</div>
                    <div style={{ fontSize:12,color:"#555",marginTop:4,fontWeight:500 }}>{item.label}</div>
                  </div>
                ))}
              </div>
              <div style={{ background:"#fff",borderRadius:16,padding:24,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:24 }}>
                <h3 style={{ margin:"0 0 16px",fontSize:16,fontWeight:700 }}>📊 Progress to Goal</h3>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
                    <thead><tr style={{ background:"#f0fdf4" }}>{["Year","Projected Balance","% of Goal"].map(h=><th key={h} style={{ padding:"9px 12px",textAlign:"left",fontWeight:700 }}>{h}</th>)}</tr></thead>
                    <tbody>{result.yearly.map((row,i)=>{
                      const p = Math.min(100,row.balance/row.target*100);
                      return (
                        <tr key={i} style={{ borderBottom:"1px solid #f1f3f5",background:i%2===0?"#fff":"#fafafa" }}>
                          <td style={{ padding:"8px 12px",fontWeight:600 }}>Year {row.year}</td>
                          <td style={{ padding:"8px 12px",color:"#059669",fontWeight:600 }}>{fmt(row.balance,sym)}</td>
                          <td style={{ padding:"8px 12px" }}>
                            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                              <div style={{ flex:1,background:"#f0fdf4",borderRadius:4,height:8,overflow:"hidden" }}>
                                <div style={{ width:`${p}%`,background:"#059669",height:"100%" }} />
                              </div>
                              <span style={{ color:p>=100?"#059669":"#555",fontWeight:p>=100?700:400 }}>{p.toFixed(0)}%</span>
                            </div>
                          </td>
                        </tr>
                      );
                    })}</tbody>
                  </table>
                </div>
              </div>
              <div style={{ background:"#fff",borderRadius:16,padding:24,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:24 }}>
                <h3 style={{ margin:"0 0 16px",fontSize:16,fontWeight:700 }}>Monthly Savings at Different Return Rates</h3>
                <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(120px,1fr))",gap:12 }}>
                  {result.scenarios.map((s,i)=>(
                    <div key={i} style={{ background:s.rate===parseFloat(result.r)?"#f0fdf4":"#fafafa",border:`2px solid ${s.rate===parseFloat(result.r)?"#059669":"#e5e7eb"}`,borderRadius:10,padding:14,textAlign:"center" }}>
                      <div style={{ fontSize:18,fontWeight:800,color:"#059669" }}>{fmtDec(s.monthly,sym)}</div>
                      <div style={{ fontSize:12,color:"#555",marginTop:2 }}>{s.rate}% return</div>
                    </div>
                  ))}
                </div>
              </div>
            </>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SavingsGoalCalculator />);
    //]]>
  </script>
</body>
</html>
